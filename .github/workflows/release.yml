name: Build and release installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-windows-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - shell: pwsh
        run: New-Item -ItemType Directory -Force build/templates | Out-Null
      - run: npx electron-builder --dir --win --x64 --publish never
      - shell: pwsh
        run: |
          Compress-Archive -Path dist/win-unpacked/* -DestinationPath build/templates/windows.zip -CompressionLevel Optimal
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /target:winexe /out:build/templates/windows-launcher.exe /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll /reference:System.Windows.Forms.dll .\build\launcher\SLWrapperLauncher.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-shell
          path: |
            build/templates/windows.zip
            build/templates/windows-launcher.exe
          if-no-files-found: error

  prepare-macos-shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p build/templates
      - run: npx electron-builder --dir --mac --universal --publish never
      - name: Zip universal shell template
        shell: bash
        run: |
          APP_PATH="$(find dist -type d -name 'SL Course Wrapper.app' -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/templates/macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-shells
          path: build/templates/macos-universal.zip
          if-no-files-found: error

  build-windows-maker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-maker
          path: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error

  build-macos-maker:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-maker
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/*.blockmap
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare-windows-shell, prepare-macos-shell, build-windows-maker, build-macos-maker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
